# deploy/minipc/nginx-samplehelp.conf — Nginx для SampleHelp (Фаза D)
# Ставится в /etc/nginx/sites-available/samplehelp.conf + симлинк в sites-enabled
# (дефолтный сайт удалить: rm /etc/nginx/sites-enabled/default).
# Роль: статика/SPA + прокси /api и /socket.io на node (:3100) + прямая отдача
# /files с SSD (длинный кэш; сверху кеширует Cloudflare CDN). Приватный бакет
# marketplace-files НЕ отдаётся (только через API backend с авторизацией).

# WebSocket-апгрейд для Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# .mjs → JavaScript: дефолтный mime.types nginx не знает mjs, а браузеры
# ОТКАЗЫВАЮТСЯ исполнять ES-модули с неверным MIME (strict MIME checking).
# Блок на уровне http (файл включается из sites-enabled внутри http {}) —
# дополняет общую таблицу типов, остальные MIME не затрагивает.
types {
    text/javascript mjs;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # домен подставляет Cloudflare Tunnel; в LAN — IP машины

    # Загрузки аудио/аватаров/пресетов: лимит backend — 25 МБ + запас
    client_max_body_size 30m;

    root /var/www/samplehelp/public;
    index index.html;

    # --- API → node ---
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Socket.IO → node (websocket + long-polling) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Живые соединения не рвём час (presence/уведомления)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Файлы с SSD: только ПУБЛИЧНЫЕ бакеты, длинный кэш ---
    # (имена файлов — uuid, содержимое неизменяемо → immutable безопасен)
    location /files/question-audio/ {
        alias /var/lib/samplehelp/storage/question-audio/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /files/presets/ {
        alias /var/lib/samplehelp/storage/presets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /files/avatars/ {
        alias /var/lib/samplehelp/storage/avatars/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # Всё прочее под /files/ (в т.ч. marketplace-files) — не отдаём
    location /files/ {
        return 404;
    }

    # --- Статика с хешем/версией: короткий кэш (CDN докеширует сверху) ---
    location ~* \.(css|js|mjs)$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- SPA-fallback ---
    # Известная открытая проблема (WORKLOG): fallback перехватывает и несуществующие
    # пути с точкой (/locales/missing.json → index.html 200). Существующие файлы
    # отдаёт try_files $uri, поэтому на работу не влияет; решение — отдельным заходом.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
