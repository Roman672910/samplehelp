# ============================================================
# nginx для SampleHelp (Этап 2 ранбука): фронтенд-статика + API-субдомен.
# Установка: замените __DOMAIN__ на ваш домен, положите в
# /etc/nginx/sites-available/samplehelp, symlink в sites-enabled,
# nginx -t && systemctl reload nginx. Затем: certbot --nginx -d <DOMAIN> -d db.<DOMAIN>
# ============================================================

# ---------- фронтенд (SPA-статика; заменяет Cloudflare Pages и server.js) ----------
server {
    listen 80;
    server_name __DOMAIN__;

    root /var/www/samplehelp/public;
    index index.html;

    # SPA-fallback: любой маршрут → index.html (как _redirects в Pages)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # долгий кэш на версионируемое/статичное
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ---------- API: self-hosted Supabase (kong) + WebSocket для Realtime ----------
server {
    listen 80;
    server_name db.__DOMAIN__;

    client_max_body_size 30m;   # лимит исходного файла ~25 МБ (Этап 3) + запас

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
